[tools]
java = "temurin-25"
node = "24.21.0"

[tasks.test]
description = "Run the test suite"
run = "./mvnw test"
run_windows = "mvnw.cmd test"

[tasks.verify]
description = "Run verification and package checks"
run = "./mvnw verify"
run_windows = "mvnw.cmd verify"

[tasks.format]
description = "Apply Java formatting"
run = "./mvnw spotless:apply"
run_windows = "mvnw.cmd spotless:apply"

[tasks.run]
description = "Run the application"
run = "./mvnw -f auth-security-sample/pom.xml spring-boot:run"
run_windows = "mvnw.cmd -f auth-security-sample/pom.xml spring-boot:run"

[tasks.frontend-install]
description = "Install the sample frontend dependencies"
run = "npm --prefix auth-security-sample/frontend install"

[tasks.frontend-dev]
description = "Run the React sample frontend with the API dev proxy"
run = "npm --prefix auth-security-sample/frontend run dev"

[tasks.frontend-build]
description = "Build the React sample frontend into the sample application static resources"
run = "npm --prefix auth-security-sample/frontend run build"
