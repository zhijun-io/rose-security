name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: zhijun-io/github-workflows/.github/workflows/ci.yml@main
    with:
      java-version: '25'
      maven-goals: 'clean -Pcoverage verify -B -ntp'
      upload-test-results: false
      codecov-files: rose-security-coverage/target/site/jacoco-aggregate/jacoco.xml
      codecov-flags: library
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
