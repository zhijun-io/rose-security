name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: zhijun-io/github-workflows/.github/workflows/ci.yml@main
    with:
      java-version: '25'
      upload-test-results: false

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify library coverage
        run: ./mvnw -B -ntp -Pcoverage -pl rose-security-coverage -am verify
      - name: Upload library coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: rose-security-coverage/target/site/jacoco-aggregate/jacoco.xml
          disable_search: true
          flags: library
          name: rose-security
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
