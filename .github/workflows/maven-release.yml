name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0). Empty means derive it from the current POM version (strips -SNAPSHOT).'
        required: false
        type: string
        default: ''
      next-version:
        description: 'Next development version to commit after the release (e.g., 0.1.1-SNAPSHOT). Empty means derive it as the release version with patch+1 and -SNAPSHOT.'
        required: false
        type: string
        default: ''
      skip-tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Default to least privilege; the release job raises it to write below.
permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: zhijun-io/github-workflows/.github/workflows/maven-release.yml@main
    with:
      version: ${{ inputs.version }}
      next-version: ${{ inputs.next-version }}
      java-version: '25'
      skip-tests: ${{ inputs['skip-tests'] || false }}
    secrets:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
