spring:
  application:
    name: rose-security-sample
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

auth:
  security:
    enabled: true
    jwt:
      access-ttl: 10m
      refresh-ttl: 30m
      refresh-absolute-ttl: 8h
      issuer: https://rose-security-sample.local
      audience: rose-security-sample-api
    mfa:
      enabled: true
      methods:
        - totp
        - email
        - webauthn
      totp-issuer: Rose Security Sample
      webauthn-rp-id: localhost
      webauthn-allowed-origins:
        - http://localhost:8083
